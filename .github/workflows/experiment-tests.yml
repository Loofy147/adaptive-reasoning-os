name: Experiment Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run protocol harness
        run: python experiments/experiment_001_selective_activation.py
      - name: Run experiment tests
        run: python -m pytest -q experiments/test_experiment_001.py
